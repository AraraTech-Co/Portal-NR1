# Portal NR-1 — imagem Docker Hub (CI / lojas standalone).
# Vars: NR1_IMAGE, NR1_DATABASE_URL, NR1_AUTH_SECRET, NR1_PUBLIC_URL,
#       NR1_HOST_PORT, DOCKER_NETWORK
name: arara-nr1

services:
  portal-nr1:
    image: ${NR1_IMAGE:?defina NR1_IMAGE}
    container_name: arara-front-portal-nr1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: ${NR1_DATABASE_URL:?defina NR1_DATABASE_URL}
      TOKEN_SECRET: ${NR1_AUTH_SECRET:?defina NR1_AUTH_SECRET}
      CLIENT_ORIGIN: ${NR1_PUBLIC_URL:?defina NR1_PUBLIC_URL}
      CLIENT_DIST: /app/client/dist
      UPLOADS_DIR: /app/uploads
    volumes:
      - nr1_uploads:/app/uploads
    ports:
      - "${NR1_HOST_PORT:-10000}:8080"
    networks:
      - sgc

volumes:
  nr1_uploads:

networks:
  sgc:
    external: true
    name: ${DOCKER_NETWORK:-sgc-network}
